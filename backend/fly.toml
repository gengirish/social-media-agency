# fly.toml app configuration file generated for campaignforge-api on 2026-03-23T07:29:54+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'campaignforge-api'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # The campaign pipeline runs as a detached asyncio task, not inside the
  # request. With min_machines_running = 0 and auto_stop = 'stop', closing the
  # browser tab drops the SSE connection, connection count hits zero, and Fly
  # can stop the machine mid-campaign — killing the in-flight task. LangGraph
  # checkpoints survive, but nothing resumes them. Keep one machine warm.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
