[project]
name = "campaignforge"
version = "0.1.0"
description = "CampaignForge AI — Multi-Agent Digital Marketing Agency"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    # NOTE: celery was declared here but never imported — background work is
    # asyncio (a detached task per campaign, plus the scheduler's 60s loop).
    # redis is kept: it is the intended backing for SSE fan-out once the
    # in-process _campaign_streams dict has to work across >1 machine.
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "sse-starlette>=2.2.0",
    "stripe>=11.0.0",
    "agentmail>=0.4.12",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# E501 only. These modules are mostly prompt text — JSON schema examples and
# instruction lines inside triple-quoted templates sent verbatim to an LLM.
# A line break inside one of those literals changes the model's input, so
# rewrapping to satisfy a style rule is a behaviour change dressed as a lint
# fix. Real code in these files is still held to the 100-column limit by every
# other rule; only the long-line check is relaxed.
"src/agency/agents/ad_copy.py" = ["E501"]
"src/agency/agents/analytics.py" = ["E501"]
"src/agency/agents/content_writer.py" = ["E501"]
"src/agency/agents/orchestrator.py" = ["E501"]
"src/agency/agents/qa_brand.py" = ["E501"]
"src/agency/agents/seo.py" = ["E501"]
"src/agency/agents/strategy.py" = ["E501"]
"src/agency/services/ad_optimization.py" = ["E501"]
"src/agency/services/client_acquisition.py" = ["E501"]
"src/agency/services/magic_brief.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection design puts these calls in parameter
# defaults — `db: AsyncSession = Depends(get_db)` is the documented idiom, not
# the mutable-default bug B008 exists to catch. Without this, B008 fires on
# every injected parameter in the codebase (217 of 294 findings) and buries
# every real lint error under noise.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
    "fastapi.Security",
    "Depends",
    "Query",
    "Path",
    "Header",
    "Body",
    "Form",
    "File",
    "Cookie",
    "Security",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--cov=src/agency", "--cov-report=term-missing", "-v"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
