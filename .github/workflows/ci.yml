name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual trigger. Added 260924 because this workflow had registered as "active"
  # since March without ever producing a single run — pushes to main and PRs into
  # it both failed to fire it, with no error anywhere in the API. A dispatchable
  # workflow turns that silence into either a run or a concrete error message.
  workflow_dispatch:

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campaignforge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        # --retries/--timeout are not tuning. pip reports a timed-out index fetch
        # as "no matching distributions available", which surfaces as a bogus
        # ResolutionImpossible naming an innocent package (260928: /simple/click/
        # timed out and the build failed claiming uvicorn had conflicting deps).
        run: pip install --retries 10 --timeout 60 -e ".[dev]"

      - name: Lint with ruff
        working-directory: backend
        run: ruff check src/ tests/

      - name: Type check with mypy
        working-directory: backend
        run: mypy src/agency/ --ignore-missing-imports

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/campaignforge_test
          JWT_SECRET: test-secret
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ESLint CLI, not `next lint`: without a config file `next lint` drops into an
      # interactive prompt and exits 0, which silently disabled this gate. The CLI can
      # never prompt, and --max-warnings=0 (in the npm script) fails on warnings too.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `next build` type-checks on its own now that next.config.mjs no longer sets
      # typescript.ignoreBuildErrors. Kept anyway: it fails in seconds instead of after
      # a full compile, and it covers files the build never traces (e2e/, config files).
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
        run: npm run build

  e2e:
    name: E2E Tests
    # Pinned: ubuntu-latest moved to 26.04 on 261031 and Playwright 1.58 cannot
    # install chromium there ("does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campaignforge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend
        working-directory: backend
        # See the backend job: a slow PyPI turns into a fake dependency conflict.
        run: pip install --retries 10 --timeout 60 -e .

      - name: Init database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: campaignforge
        run: |
          psql -f db/init.sql
          psql -f db/seed.sql

      - name: Start backend
        working-directory: backend
        env:
          APP_ENV: dev
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/campaignforge
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          CORS_ORIGINS: '["http://localhost:3000"]'
          FRONTEND_URL: http://localhost:3000
        run: |
          uvicorn agency.main:app --host 0.0.0.0 --port 8001 &
          sleep 5
          curl -f http://localhost:8001/api/v1/health

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: "true"
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8001
          PLAYWRIGHT_SKIP_WEBSERVER: "0"
          NEXT_PUBLIC_API_URL: http://localhost:8001
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  deploy-backend:
    name: Deploy Backend (Fly)
    # Only a push to main ships, and only after every check above passed —
    # E2E included, so a backend change that breaks the browser flow stays out.
    # PRs and develop never reach this job.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    # A GitHub environment so required reviewers or a wait timer can be added in
    # Settings › Environments › production without editing this file.
    environment:
      name: production
      url: https://campaignforge-api.fly.dev/api/v1/health
    # Two merges in quick succession must deploy in order, never in parallel and
    # never cancel a half-finished rollout.
    concurrency:
      group: fly-deploy-campaignforge-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A frontend- or docs-only merge has nothing to ship to Fly; redeploying
      # anyway restarts the warm machine and can kill an in-flight campaign task
      # (see fly.toml). A manual dispatch always deploys.
      - name: Detect backend changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] \
             || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- backend/; then
            echo "No backend changes in $BEFORE..$GITHUB_SHA — skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat "$BEFORE" "$GITHUB_SHA" -- backend/
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changes.outputs.deploy == 'true'

      # Schema changes are NOT applied here: db/migrations/ scripts are run by hand
      # on Neon, before the merge whose code needs them. Merging first would deploy
      # code that SELECTs a column prod does not have yet.
      - name: fly deploy
        if: steps.changes.outputs.deploy == 'true'
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a campaignforge-api

      # One-shot smoke test against the dependency-free liveness route — it does
      # not touch Neon, so it cannot wake the database.
      - name: Smoke test
        if: steps.changes.outputs.deploy == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://campaignforge-api.fly.dev/api/v1/health; then exit 0; fi
            sleep 10
          done
          echo "::error::campaignforge-api did not answer /api/v1/health after deploy"
          exit 1
